name: Verify and build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest
      - name: Verify private candidate delivery guards (offline)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  lint-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:lintRelease

  debug-apk:
    needs: [unit-tests, lint-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest

  # Opt-in RC preflight: run real SQLite v7->v8 migration/pruning tests.
  # Only PR #13 with the temporary label runs this expensive emulator gate.
  beta6-sqlite-emulator:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 13 && contains(github.event.pull_request.labels.*.name, 'beta6-instrumentation')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Enable KVM for hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated beta6 database tests on Android 15 (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            gradle --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # The Gradle UTP APK installer fails to load kotlin.enums.EnumEntriesKt
            # on AGP 8.7.3 before tests start; direct instrumentation bypasses
            # only that host-side runner. Insist on all THREE real SQLite tests.
            adb shell am instrument -w \
              -e class io.github.highwindbr.aaxp.discovery.CatalogDatabaseInstrumentedTest \
              io.github.highwindbr.aaxp.test/androidx.test.runner.AndroidJUnitRunner \
              | tee beta6-sqlite-instrumentation.log
            grep -Eq '^OK \(3 tests\)' beta6-sqlite-instrumentation.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=|Process crashed' beta6-sqlite-instrumentation.log; then
              exit 1
            fi
      - name: Save database test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta6-android-sqlite-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            beta6-sqlite-instrumentation.log
