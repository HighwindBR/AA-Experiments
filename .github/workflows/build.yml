name: Verify and build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest

  lint-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:lintRelease

  device-heap-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Require exact private regression fixtures
        run: sha256sum -c fixtures/SHA256SUMS
      - name: 256 MiB installed-scan gate
        run: gradle --no-daemon --max-workers=1 -Daa.test.heap=256m :app:testDebugUnitTest --tests io.github.aaexperiments.discovery.InstalledHeapRegressionTest
      - name: 256 MiB compatibility gate
        run: gradle --no-daemon --max-workers=1 -Daa.test.heap=256m :app:testDebugUnitTest --tests io.github.aaexperiments.discovery.InstalledCompatibilityHeapRegressionTest
      - name: 256 MiB directed-resolve gate
        run: gradle --no-daemon --max-workers=1 -Daa.test.heap=256m :app:testDebugUnitTest --tests io.github.aaexperiments.discovery.DeepResolveHeapRegressionTest

  full-corpus-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Require exact private regression fixtures
        run: sha256sum -c fixtures/SHA256SUMS
      - name: Frozen 17.8 full-corpus release gate
        run: >-
          gradle --no-daemon --max-workers=1 -Daa.test.heap=256m -Daa.full.deep=true
          :app:testDebugUnitTest
          --tests io.github.aaexperiments.discovery.FullDeepResolveDistributionTest

  debug-apk:
    needs: [unit-tests, lint-release, device-heap-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AA-Experiments-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, lint-release, device-heap-gate, full-corpus-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aaxp-release.jks"
      - name: Build signed release APK
        env:
          AAXP_RELEASE_STORE_FILE: ${{ runner.temp }}/aaxp-release.jks
          AAXP_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          AAXP_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AAXP_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=1 :app:assembleRelease
      - name: Verify v2 signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Name artifact and publish checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk AAExperiments-1.0.0-beta1.apk
          sha256sum AAExperiments-1.0.0-beta1.apk > AAExperiments-1.0.0-beta1.apk.sha256
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          AAExperiments-1.0.0-beta1.apk
          AAExperiments-1.0.0-beta1.apk.sha256
          --title "AA Experiments ${GITHUB_REF_NAME}"
          --generate-notes
