name: Private release gates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_private_gates:
        description: Run release gates using the configured private fixtures and self-hosted runner
        required: true
        default: false
        type: boolean
      build_signed_candidate:
        description: Build a gated signed candidate on an allowlisted feature branch (beta4 or beta5)
        required: false
        default: false
        type: boolean
      deliver_private_candidate:
        description: Also upload the signed APK to an unpublished draft in a separate PRIVATE repository (requires setup)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1

jobs:
  release-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require gates and signing when private delivery is requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deliver_private_candidate && (!inputs.run_private_gates || !inputs.build_signed_candidate) }}
        run: |
          echo "::error::Private delivery requires BOTH run_private_gates and build_signed_candidate."
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest
      - name: Verify private delivery guardrails (no network)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  release-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon --max-workers=1 :app:lintRelease

  private-release-gates:
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/tags/v1.0.0-beta3' ||
        github.ref == 'refs/tags/v1.0.0-beta4')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_private_gates &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/release/1.0.0-beta3' ||
        github.ref == 'refs/heads/feature/beta4-getter-probe-preflight' ||
        github.ref == 'refs/heads/release/1.0.0-beta4' ||
        github.ref == 'refs/heads/feature/beta5-media-startup-preflight1' ||
        github.ref == 'refs/heads/feature/beta5-rc1'))
    runs-on: [self-hosted, linux, x64, aa-private-fixtures]
    steps:
      - uses: actions/checkout@v4
      - name: Stage private APKM fixtures
        env:
          PRIVATE_FIXTURES_DIR: ${{ vars.AAXP_PRIVATE_FIXTURES_DIR }}
        run: |
          test -n "$PRIVATE_FIXTURES_DIR"
          test -d "$PRIVATE_FIXTURES_DIR"
          mkdir -p fixtures/apks
          cp -a "$PRIVATE_FIXTURES_DIR"/. fixtures/apks/
      - name: Require exact private regression fixtures
        run: sha256sum -c fixtures/SHA256SUMS
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: 256 MiB installed-scan gate
        run: gradle --no-daemon --max-workers=1 -Daa.test.heap=256m :app:testDebugUnitTest --tests io.github.highwindbr.aaxp.discovery.InstalledHeapRegressionTest
      - name: 256 MiB compatibility gate
        run: gradle --no-daemon --max-workers=1 -Daa.test.heap=256m :app:testDebugUnitTest --tests io.github.highwindbr.aaxp.discovery.InstalledCompatibilityHeapRegressionTest
      - name: 256 MiB directed-resolve gate
        run: gradle --no-daemon --max-workers=1 -Daa.test.heap=256m :app:testDebugUnitTest --tests io.github.highwindbr.aaxp.discovery.DeepResolveHeapRegressionTest
      - name: Frozen 17.8 full-corpus release gate
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=1 -Daa.test.heap=256m -Daa.full.deep=true \
            :app:testDebugUnitTest \
            --tests io.github.highwindbr.aaxp.discovery.FullDeepResolveDistributionTest
          # JUnit assumptions mark a test skipped but Gradle exits with success.
          # A release gate must prove its selected test actually ran.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("app/build/test-results/testDebugUnitTest/TEST-io.github.highwindbr.aaxp.discovery.FullDeepResolveDistributionTest.xml")
          if not path.is_file():
              raise SystemExit("Full-corpus JUnit XML missing; gate did not run")
          root = ET.parse(path).getroot()
          counts = {name: int(root.attrib.get(name, "0")) for name in ("tests", "failures", "errors", "skipped")}
          print("Full-corpus JUnit verification:", counts)
          if counts != {"tests": 1, "failures": 0, "errors": 0, "skipped": 0}:
              raise SystemExit("Full-corpus gate must execute exactly one passing, non-skipped JUnit test")
          PY

  signed-development-candidate:
    # Manual-only, exact allowlisted feature branch; NEVER on tag, PR or publication.
    # Keystore stays on the trusted runner. Candidate APK stays local unless
    # the maintainer explicitly requests a draft in a SEPARATE PRIVATE repo.
    # Never use Actions artifacts or Releases in the PUBLIC source repository.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_signed_candidate &&
      inputs.run_private_gates &&
      (github.ref == 'refs/heads/feature/beta4-getter-probe-preflight' ||
       github.ref == 'refs/heads/feature/beta5-media-startup-preflight1' ||
       github.ref == 'refs/heads/feature/beta5-rc1')
    needs: [release-unit-tests, release-lint, private-release-gates]
    runs-on: [self-hosted, linux, x64, aa-private-fixtures]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require private delivery settings when explicitly requested
        if: ${{ inputs.deliver_private_candidate }}
        env:
          AAXP_PRIVATE_DELIVERY_TOKEN: ${{ secrets.AAXP_PRIVATE_DELIVERY_TOKEN }}
          AAXP_PRIVATE_DELIVERY_REPO: ${{ vars.AAXP_PRIVATE_DELIVERY_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AAXP_PRIVATE_DELIVERY_TOKEN" ] || [ -z "$AAXP_PRIVATE_DELIVERY_REPO" ]; then
            echo "::error::Set the private repository variable and restricted token secret before opting into device delivery."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # The trusted WSL host already holds the SDK. setup-android contacts
      # dl.google.com even for an installed platform and once hung for ~2 h.
      # Validate the existing local SDK instead of accessing the network.
      - name: Use preinstalled Android SDK without network setup
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/.android/sdk}"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using preinstalled SDK: $SDK_ROOT"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build, verify and retain candidate only on WSL
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          AAXP_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          AAXP_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AAXP_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${RUNNER_TEMP:?}"
          : "${ANDROID_HOME:?}"
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$AAXP_RELEASE_STORE_PASSWORD"
          test -n "$AAXP_RELEASE_KEY_ALIAS"
          test -n "$AAXP_RELEASE_KEY_PASSWORD"
          KEYSTORE="$(mktemp "$RUNNER_TEMP/aaxp-candidate-XXXXXXXX.jks")"
          BASE_DIR="$(mktemp -d "$RUNNER_TEMP/aaxp-published-baseline-XXXXXXXX")"
          cleanup() { rm -f "$KEYSTORE"; rm -rf "$BASE_DIR"; }
          trap cleanup EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          export AAXP_RELEASE_STORE_FILE="$KEYSTORE"
          gradle --no-daemon --max-workers=1 :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          BADGING=$("$TOOLS/aapt" dump badging "$APK" | sed -n '1p')
          [[ "$BADGING" == *"name='io.github.highwindbr.aaxp'"* ]]
          # Only exact source ref/version combinations may access signing secrets.
          case "$GITHUB_REF" in
            refs/heads/feature/beta4-getter-probe-preflight)
              EXPECTED_VERSION="1.0.0-beta4"; EXPECTED_CODE=169
              BASE_VERSION="1.0.0-beta3"
              BASE_SHA256="6b282046ab5420bcfbdd47bb7c6fe0068aee944310b6174fa86deefec786f48e"
              ;;
            refs/heads/feature/beta5-media-startup-preflight1)
              EXPECTED_VERSION="1.0.0-beta5-preflight1"; EXPECTED_CODE=170
              BASE_VERSION="1.0.0-beta4"
              BASE_SHA256="c8e5566ab50c681bbb88f216be48f8725a6d03bdce3abe845535faf58f56bf43"
              ;;
            refs/heads/feature/beta5-rc1)
              EXPECTED_VERSION="1.0.0-beta5-rc1"; EXPECTED_CODE=177
              BASE_VERSION="1.0.0-beta4"
              BASE_SHA256="c8e5566ab50c681bbb88f216be48f8725a6d03bdce3abe845535faf58f56bf43"
              ;;
            *) echo "::error::Unapproved ref"; exit 1 ;;
          esac
          [[ "$BADGING" == *"versionName='$EXPECTED_VERSION'"* ]]
          [[ "$BADGING" == *"versionCode='$EXPECTED_CODE'"* ]]
          # Trust only a SHA-256 verified official predecessor APK as signing baseline.
          BASE="$BASE_DIR/AAExperiments-${BASE_VERSION}.apk"
          curl --fail --location --silent --show-error --retry 2 \
            --output "$BASE" \
            "https://github.com/HighwindBR/AA-Experiments/releases/download/v${BASE_VERSION}/AAExperiments-${BASE_VERSION}.apk"
          printf "%s  %s\n" "$BASE_SHA256" "$BASE" | sha256sum -c -
          BASE_CERT=$("$TOOLS/apksigner" verify --print-certs "$BASE" | sed -n 's/.*certificate SHA-256 digest: //p' | sed -n '1p')
          NEW_CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | sed -n '1p')
          test -n "$BASE_CERT"
          test "$BASE_CERT" = "$NEW_CERT"
          DEST="$HOME/aaxp-private-candidates"
          mkdir -p "$DEST"
          chmod 700 "$DEST"
          TARGET="$DEST/AAExperiments-${EXPECTED_VERSION}-candidate.apk"
          cp "$APK" "$TARGET.new"
          chmod 600 "$TARGET.new"
          mv -f "$TARGET.new" "$TARGET"
          (cd "$DEST" && sha256sum "$(basename "$TARGET")" > "$(basename "$TARGET").sha256")
          echo "Verified signed candidate stored LOCALLY at $TARGET"
          echo "Certificate SHA-256 matches official ${BASE_VERSION}: $NEW_CERT"
          echo "No public GitHub artifact uploaded, official tag pushed or Release published."

      - name: Upload candidate to a private draft for phone download
        if: ${{ inputs.deliver_private_candidate }}
        env:
          AAXP_PRIVATE_DELIVERY_TOKEN: ${{ secrets.AAXP_PRIVATE_DELIVERY_TOKEN }}
          AAXP_PRIVATE_DELIVERY_REPO: ${{ vars.AAXP_PRIVATE_DELIVERY_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          # Signed on an allowlisted branch and compared against the published
          # SHA-256-verified predecessor certificate.
          python3 scripts/private_candidate_delivery.py

  signed-release:
    # Publishing is tag-triggered ONLY, never by a dispatch on a feature/RC branch.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/tags/v1.0.0-beta3' ||
       github.ref == 'refs/tags/v1.0.0-beta4')
    needs: [release-unit-tests, release-lint, private-release-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aaxp-release.jks"
      - name: Build signed release APK
        env:
          AAXP_RELEASE_STORE_FILE: ${{ runner.temp }}/aaxp-release.jks
          AAXP_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          AAXP_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AAXP_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=1 :app:assembleRelease
      - name: Verify signed APK and release package metadata
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/apksigner" verify --print-certs "$APK"
          # sed consumes all input, avoiding SIGPIPE with set -o pipefail.
          BADGING=$("$TOOLS/aapt" dump badging "$APK" | sed -n '1p')
          echo "$BADGING"
          [[ "$BADGING" == *"name='io.github.highwindbr.aaxp'"* ]]
          [[ "$BADGING" == *"versionName='${GITHUB_REF_NAME#v}'"* ]]
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          test -n "$VERSION_CODE"
          if [ "$GITHUB_REF" = "refs/tags/v1.0.0-beta4" ]; then
            test "$VERSION_CODE" -eq 169
          else
            test "$VERSION_CODE" -gt 143
          fi

      - name: Verify upgrade signing certificate against official beta3
        if: github.ref == 'refs/tags/v1.0.0-beta4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beta3"
          gh release download v1.0.0-beta3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "AAExperiments-1.0.0-beta3.apk" \
            --dir "$RUNNER_TEMP/beta3"
          BASE="$RUNNER_TEMP/beta3/AAExperiments-1.0.0-beta3.apk"
          echo "6b282046ab5420bcfbdd47bb7c6fe0068aee944310b6174fa86deefec786f48e  $BASE" | sha256sum -c -
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BASE_CERT=$("$APKSIGNER" verify --print-certs "$BASE" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test -n "$BASE_CERT"
          test "$BASE_CERT" = "$NEW_CERT"

      - name: Name artifact and publish checksum
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "AAExperiments-$VERSION.apk"
          sha256sum "AAExperiments-$VERSION.apk" > "AAExperiments-$VERSION.apk.sha256"

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE_NOTES_$VERSION.md"
          test -s "$NOTES"
          gh release create "$GITHUB_REF_NAME" \
            "AAExperiments-$VERSION.apk" \
            "AAExperiments-$VERSION.apk.sha256" \
            --title "AA Experiments $GITHUB_REF_NAME" \
            --notes-file "$NOTES"
